on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu qemu-system-riscv clang-format bc
      - run: make fmt && git diff --exit-code
      - run: make kernel/kernel fs.img
      - run: ./test-xv6.py usertests
      # The crash test kills QEMU at a chosen moment and hopes to catch a
      # committed-but-uninstalled log transaction.  That is probabilistic,
      # so retry a few times before failing the job.
      - name: Crash-recovery tests
        run: |
          for attempt in 1 2 3; do
            echo "::group::crash attempt $attempt"
            if ./test-xv6.py crash; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
          done
          exit 1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install riscv64-elf-gcc
      - run: make kernel/kernel fs.img
