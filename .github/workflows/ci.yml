# Project CI: build, command path resolution (execvp) end-to-end tests under
# QEMU, and checks for the host-side Python/shell tooling.  The upstream xv6
# workflow in test.yml (format check, usertests, crash tests) runs alongside.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # apt occasionally stalls on the runners; bound each attempt and retry.
      - name: Install packages
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            sudo timeout 180 apt-get update &&
              sudo timeout 400 apt-get install -y gcc-riscv64-linux-gnu && exit 0
            echo "apt attempt $i failed" >&2
          done
          exit 1
      # -Werror is on in the Makefile, so warnings fail the build.
      - run: make kernel/kernel fs.img
      # Generated files (user/uprogs.h, fs.img, ...) must stay ignored.
      - name: Build leaves the tree clean
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  path-resolution:
    # Boots xv6 in QEMU, logs in, and drives the real shell: bare commands from
    # a subdirectory, pipes/redirects/lists/background, pathtest, usertests -q.
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpus: [1, 3]
    steps:
      - uses: actions/checkout@v7
      # apt occasionally stalls on the runners; bound each attempt and retry.
      - name: Install packages
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            sudo timeout 180 apt-get update &&
              sudo timeout 400 apt-get install -y gcc-riscv64-linux-gnu qemu-system-riscv bc && exit 0
            echo "apt attempt $i failed" >&2
          done
          exit 1
      - run: python3 scripts/tests/test_path_e2e.py --cpus ${{ matrix.cpus }}
      - name: Upload raw QEMU log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-e2e-cpus${{ matrix.cpus }}
          path: scripts/logs/path_e2e_${{ matrix.cpus }}.log
          if-no-files-found: warn

  tooling:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m py_compile agent/*.py scripts/tests/*.py
      - run: bash -n scripts/run_agent.sh
