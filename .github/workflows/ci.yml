# Project CI: build, command path resolution (execvp) end-to-end tests under
# QEMU, and checks for the host-side Python/shell tooling.  The upstream xv6
# workflow in test.yml (format check, usertests, crash tests) runs alongside.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job on purpose: the toolchain download dominates the run time and the
  # Ubuntu mirror is sometimes very slow, so install the packages once.
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      # Stalled downloads are retried: --download-only is safe to kill and the
      # packages that finished stay in apt's cache, so each retry resumes.
      - name: Install packages
        timeout-minutes: 25
        env:
          PKGS: gcc-riscv64-linux-gnu qemu-system-riscv bc
        run: |
          for i in 1 2 3; do
            sudo timeout 120 apt-get update -o Acquire::Retries=3 && break
          done
          for i in 1 2 3 4 5 6; do
            sudo timeout 240 apt-get install -y --download-only --no-install-recommends \
              -o Acquire::Retries=3 $PKGS && break
            echo "download attempt $i did not finish; retrying" >&2
          done
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 $PKGS

      # -Werror is on in the Makefile, so warnings fail the build.
      - run: make kernel/kernel fs.img

      # Generated files (user/uprogs.h, fs.img, ...) must stay ignored.
      - name: Build leaves the tree clean
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      # Boots xv6 in QEMU, logs in, and drives the real shell: bare commands
      # from a subdirectory, pipes/redirects/lists/background, pathtest and
      # usertests -q, on CPUS=1 and CPUS=3.
      - name: Path resolution end-to-end (CPUS=1, CPUS=3)
        run: python3 scripts/tests/test_path_e2e.py

      # Drives xv6 through agent/qemu_bridge.py the way the agent does:
      # xrun output is held, xcommit releases it, xabort drops it, and the
      # in-guest spectest passes, on CPUS=1 and CPUS=3.
      - name: Externalization barrier end-to-end (CPUS=1, CPUS=3)
        run: python3 scripts/tests/test_spec_e2e.py

      # crashat(n) panics at each crash point of a speculative xcommit; the
      # machine reboots on the same fs.img and the file must be wholly old or
      # new, with no output printed by a commit that crashed.  The file-state
      # rows read SKIP until the shadow table is merged and turn on by
      # themselves (test_spec_crash.py probes for it).
      - name: Crash during xcommit (CPUS=1, CPUS=3)
        run: python3 scripts/tests/test_spec_crash.py

      - name: Upload raw QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-e2e-logs
          path: |
            scripts/logs/path_e2e_*.log
            scripts/logs/spec_e2e_*.log
            scripts/logs/spec_crash_*.log
          if-no-files-found: warn

  tooling:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m py_compile agent/*.py scripts/*.py scripts/tests/*.py
      - run: bash -n scripts/run_agent.sh
